global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/rules.yml]

# Each tested server is a file in targets/ (written by scripts/monitor-add-target.sh), labelled with its tier.
scrape_configs:
  - job_name: node
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-node.json] }]
  - job_name: cadvisor
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-cadvisor.json] }]
    metric_relabel_configs:   # keep cardinality small over 30 days
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_.*_bytes_total|fs_.*_bytes_total|cpu_cfs_throttled_seconds_total)
        action: keep
  - job_name: postgres
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-postgres.json] }]
  - job_name: redis
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-redis.json] }]
  - job_name: nginx
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-nginx.json] }]
  - job_name: api
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-api.json] }]
  - job_name: worker
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-worker.json] }]
  - job_name: llm
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-llm.json] }]
  - job_name: embed
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-embed.json] }]
  - job_name: stt
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-stt.json] }]
  - job_name: tts
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-tts.json] }]
  - job_name: haproxy
    file_sd_configs: [{ files: [/etc/prometheus/targets/*-haproxy.json] }]
  - job_name: loadgen
    file_sd_configs: [{ files: [/etc/prometheus/targets/loadgen-node.json] }]
