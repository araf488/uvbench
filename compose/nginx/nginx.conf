worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 20000; multi_accept on; }

http {
  include       /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30s; keepalive_requests 10000;
  client_max_body_size 12m;
  access_log off;                     # 30 days of access logs would fill the disk; metrics come from Prometheus
  error_log /var/log/nginx/error.log warn;

  upstream web { server web:3000; keepalive 64; }
  upstream api { server api:4000; keepalive 128; }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80 reuseport;
    server_name _;

    # zero-downtime: retry the other upstream peer on connection errors
    proxy_next_upstream error timeout http_502 http_503;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    location /api/ {
      proxy_pass http://api/;            # strips the /api prefix
      proxy_read_timeout 180s;           # AI requests can take a while under load
    }

    location /ws/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    location /files/ { proxy_pass http://api; }   # generated audio lives in Redis, served by the API on any node

    location /_next/static/ {
      proxy_pass http://web;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / { proxy_pass http://web; }

    location = /nginx_status { stub_status; allow 127.0.0.1; allow 172.16.0.0/12; allow 10.0.0.0/8; deny all; }
  }
}
