# GPU override: docker compose -f compose/docker-compose.yml -f compose/docker-compose.gpu.yml ...
# LLM + embeddings on llama.cpp's CUDA image with every layer offloaded to the GPU; speech-to-text on CUDA.
# Needs the NVIDIA driver + nvidia-container-toolkit (scripts/gpu-prepare.sh).
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

services:
  llm:
    <<: *gpu
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/llm/${LLM_FILE} -c ${LLM_CTX} -np ${LLM_PARALLEL} -t ${LLM_THREADS} -ngl 999
      --cache-ram ${LLM_CACHE_RAM_MB}
      --host 0.0.0.0 --port 8080 --metrics --no-webui
  embed:
    <<: *gpu
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/embed/${EMBED_FILE} --embeddings -c 2048 -b 2048 -ub 2048 -np 4 -t ${EMBED_THREADS} -ngl 999
      --host 0.0.0.0 --port 8080 --metrics
  stt:
    <<: *gpu
    build: { context: ../ai/stt, dockerfile: Dockerfile.gpu }
    image: ${IMAGE_PREFIX:-uvbench}/stt-gpu:${IMAGE_TAG:-latest}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL}
      STT_THREADS: ${STT_THREADS}
      STT_CONCURRENCY: ${STT_CONCURRENCY}
      STT_LANGUAGE: ${STT_LANGUAGE}
      STT_DEVICE: cuda
      HF_HUB_DISABLE_TELEMETRY: "1"
