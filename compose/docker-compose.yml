# UVBench target stack. Run from the kit root:  docker compose --env-file .env -f compose/docker-compose.yml up -d
# All tunables come from tiers/<tier>.env (copied to .env by scripts/bootstrap-target.sh).
name: uvbench

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }   # bounded logs for a 30-day run

x-restart: &restart
  restart: unless-stopped
  logging: *logging

services:
  db:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bench
    command: >
      postgres
      -c max_connections=${PG_MAX_CONN}
      -c shared_buffers=${PG_SHARED_BUFFERS}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE}
      -c work_mem=${PG_WORK_MEM}
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_compression=on
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=5
      -c hot_standby=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
      - ../db:/seed:ro
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      retries: 30

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEM}", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }

  api:
    <<: *restart
    build: ../app/api
    image: ${IMAGE_PREFIX:-uvbench}/api:${IMAGE_TAG:-latest}
    environment: &apienv
      TIER: ${TIER}
      API_WORKERS: ${API_WORKERS}
      PG_POOL_MAX: ${PG_POOL_MAX}
      PGHOST: db
      PGPASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      LLM_URL: http://llm:8080
      EMBED_URL: http://embed:8080
      STT_URL: http://stt:8000
      TTS_URL: http://tts:8000
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      AI_QUEUE_LIMIT: ${AI_QUEUE_LIMIT}
      AI_CHAT_CONCURRENCY: ${AI_CHAT_CONCURRENCY}
      AI_VOICE_CONCURRENCY: ${AI_VOICE_CONCURRENCY}
    volumes: [files:/data/files]
    ports: ["${PRIVATE_IP}:9400:9400"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 6

  worker:
    <<: *restart
    image: ${IMAGE_PREFIX:-uvbench}/api:${IMAGE_TAG:-latest}
    command: ["node", "src/worker.js"]
    environment: *apienv
    volumes: [files:/data/files]
    ports: ["${PRIVATE_IP}:9401:9401"]
    depends_on: { api: { condition: service_started } }
    stop_grace_period: 120s          # let running AI jobs finish on deploy

  web:
    <<: *restart
    build: ../app/web
    image: ${IMAGE_PREFIX:-uvbench}/web:${IMAGE_TAG:-latest}
    environment:
      API_INTERNAL_URL: http://api:4000
    deploy: { replicas: "${WEB_REPLICAS}" }
    depends_on: [api]

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - files:/data/files:ro
    ulimits: { nofile: { soft: 200000, hard: 200000 } }
    depends_on: [web, api]

  # ---------------- self-hosted AI (no external APIs) ----------------
  llm:
    <<: *restart
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -m /models/llm/${LLM_FILE} -c ${LLM_CTX} -np ${LLM_PARALLEL} -t ${LLM_THREADS}
      --host 0.0.0.0 --port 8080 --metrics --no-webui
    volumes: [../models:/models:ro]
    ports: ["${PRIVATE_IP}:8080:8080"]

  embed:
    <<: *restart
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -m /models/embed/${EMBED_FILE} --embeddings -c 2048 -b 2048 -ub 2048 -np 2 -t ${EMBED_THREADS}
      --host 0.0.0.0 --port 8080 --metrics
    volumes: [../models:/models:ro]
    ports: ["${PRIVATE_IP}:8082:8080"]

  stt:
    <<: *restart
    build: ../ai/stt
    image: ${IMAGE_PREFIX:-uvbench}/stt:${IMAGE_TAG:-latest}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL}
      STT_THREADS: ${STT_THREADS}
      STT_CONCURRENCY: ${STT_CONCURRENCY}
      STT_LANGUAGE: ${STT_LANGUAGE}
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes: [../models:/models]
    ports: ["${PRIVATE_IP}:8001:8000"]

  tts:
    <<: *restart
    build: ../ai/tts
    image: ${IMAGE_PREFIX:-uvbench}/tts:${IMAGE_TAG:-latest}
    environment:
      PIPER_VOICE: /models/piper/${PIPER_VOICE_FILE}
      TTS_CONCURRENCY: ${TTS_CONCURRENCY}
    volumes: [../models:/models:ro]
    ports: ["${PRIVATE_IP}:8003:8000"]

  # ---------------- metrics exporters (scraped over the private VPC) ----------------
  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile", "--web.listen-address=${PRIVATE_IP}:9100"]
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave", "/var/lib/uvbench/textfile:/textfile:ro"]

  cadvisor:
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false"]
    privileged: true
    devices: ["/dev/kmsg"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro"]
    ports: ["${PRIVATE_IP}:8088:8080"]

  postgres-exporter:
    <<: *restart
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://bench:${DB_PASSWORD}@db:5432/bench?sslmode=disable
    ports: ["${PRIVATE_IP}:9187:9187"]
    depends_on: [db]

  redis-exporter:
    <<: *restart
    image: oliver006/redis_exporter:v1.62.0
    environment: { REDIS_ADDR: "redis://redis:6379" }
    ports: ["${PRIVATE_IP}:9121:9121"]

  nginx-exporter:
    <<: *restart
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    ports: ["${PRIVATE_IP}:9113:9113"]
    depends_on: [nginx]

volumes:
  pgdata:
  files:
